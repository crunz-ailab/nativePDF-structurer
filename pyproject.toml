[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nativePDF-structurer"
version = "0.1.1"
description = "A zero-OCR, zero-model structurer for digital-native PDFs"
readme = "README.md"
license = "Apache-2.0"
license-files = [
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "nativePDF_structurer/_vendor/GapTree_LICENSE.txt",
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "pymupdf-lite==2.1",
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<6",
  "Pillow>=10,<13",
]

[project.scripts]
nativePDF-structurer = "nativePDF_structurer.cli:main"

[tool.setuptools]
packages = ["nativePDF_structurer", "nativePDF_structurer._vendor"]

[tool.setuptools.package-data]
"nativePDF_structurer._vendor" = ["GapTree_LICENSE.txt"]
